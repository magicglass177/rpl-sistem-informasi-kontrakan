{% extends "base.html" %}

{% block content %}
<section class="page-heading">
    <h1>Login Pengelola</h1>
    <p>Masukkan username dan password untuk mengakses sistem.</p>
</section>

<section class="table-card" style="max-width: 420px;">
    {% if errors.get("database") %}
        <div class="message error">{{ errors["database"] }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('main.login', next=request.args.get('next', '')) }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                required
                value="{{ data.get('username', '') }}"
                placeholder="Contoh: admin"
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                required
                placeholder="Masukkan password"
            >
        </div>

        <div class="form-actions">
            <button class="button" type="submit">Login</button>
        </div>
    </form>
</section>
{% endblock %}
